name: Verify published Windows release 1.0.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing published release 1.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 1.0.10 --repo hassandow/bank-discounts-updates --json isDraft,isPrerelease,assets,tagName
          gh release view 1.0.10 --repo hassandow/bank-discounts-updates --json assets --jq '.assets[].name'
