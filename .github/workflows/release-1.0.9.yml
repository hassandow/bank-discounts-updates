name: Build and publish Windows release 1.0.11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify application version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.0.11") {
            throw "Expected package.json version 1.0.11, found $version"
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify update metadata and installer
        shell: pwsh
        run: |
          if (!(Test-Path "dist/latest.yml")) { throw "dist/latest.yml was not generated" }
          $installer = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          if (!$installer) { throw "Windows installer was not generated" }
          $yaml = Get-Content "dist/latest.yml" -Raw
          if ($yaml -notmatch [regex]::Escape($installer.Name)) {
            throw "latest.yml does not reference the generated installer $($installer.Name)"
          }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host $yaml

      - name: Publish release 1.0.11
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.11
          name: 1.0.11
          target_commitish: main
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
