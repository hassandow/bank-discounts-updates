name: Build and publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish release 1.0.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.9
          name: 1.0.9
          target_commitish: main
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
